name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: true
          # Set these under Settings -> Secrets and variables -> Actions in this repo.
          # If left unset, the build still succeeds — the deployed app just falls back
          # to local-only (no cloud sync), exactly like local dev without a .env file.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Add SPA fallback for GitHub Pages (404 -> index.html)
        run: cp dist/index.html dist/404.html

      - name: Verify Pages artifact contents
        run: |
          set -e
          echo "Checking required files exist in dist/ before upload..."
          test -f dist/index.html || (echo "::error::dist/index.html is missing" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html is missing" && exit 1)
          test -f dist/manifest.webmanifest || (echo "::error::dist/manifest.webmanifest is missing" && exit 1)
          test -f dist/sw.js || (echo "::error::dist/sw.js is missing" && exit 1)
          test -f dist/registerSW.js || (echo "::error::dist/registerSW.js is missing" && exit 1)
          if ! cmp -s dist/index.html dist/404.html; then
            echo "::error::dist/404.html is not byte-identical to dist/index.html"
            exit 1
          fi
          echo "All required files present, 404.html matches index.html byte-for-byte."
          ls -la dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
